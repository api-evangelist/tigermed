name: Tigermed
description: >-
  Tigermed (Hangzhou Tigermed Consulting Co., Ltd.) is a leading global contract
  research organization (CRO) providing integrated drug and medical device
  development services across the full clinical lifecycle. Its capabilities span
  preclinical development (medicinal chemistry, compound screening, toxicology,
  and bioanalytical services), clinical development (medical writing, clinical
  monitoring, regulatory affairs, and data management), and integrated services
  including central laboratories, pharmacovigilance, medical imaging, quality
  assurance, and real-world and post-marketing studies. The company reports
  11,000+ global employees, 180+ offices and locations, and 4,000+ customers,
  supporting the development of 170+ innovative drugs. Tigermed was surfaced as a
  portfolio company of Qiming Venture Partners and added to the API Evangelist
  network; it publishes no public developer, API, or technical platform surface.
